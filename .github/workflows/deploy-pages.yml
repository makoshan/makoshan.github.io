name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - gwern-style
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GWERN_LINK_SIZES: "0"
      GWERN_ANNOTATIONS: "0"
      GWERN_LINK_ANNOTATIONS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4' # Adjust if a specific version is required
          cabal-version: 'latest'

      - name: Cache
        uses: actions/cache@v3
        env:
          cache-name: cache-cabal
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            build/dist-newstyle
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('build/*.cabal') }}-${{ hashFiles('build/cabal.project') }}-${{ hashFiles('build/**/*.hs') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache hakyll executable
        uses: actions/cache@v3
        with:
          path: build/.cache/hakyll/hakyll
          key: ${{ runner.os }}-hakyll-bin-${{ hashFiles('build/*.cabal') }}-${{ hashFiles('build/cabal.project') }}-${{ hashFiles('build/**/*.hs') }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if ! command -v convert >/dev/null 2>&1; then
            if command -v magick >/dev/null 2>&1; then
              sudo ln -s "$(command -v magick)" /usr/local/bin/convert
            fi
          fi
          cd build
          cabal update
          cabal build --only-dependencies

      - name: Prepare hakyll executable
        run: |
          mkdir -p build/.cache/hakyll
          if [ -x "build/.cache/hakyll/hakyll" ]; then
            echo "Using cached hakyll executable"
          else
            cd build
            cabal build hakyll
            cp "$(cabal list-bin hakyll)" ".cache/hakyll/hakyll"
          fi

      - name: Build Site
        run: |
          cd build
          if [ -x ".cache/hakyll/hakyll" ]; then
            ./.cache/hakyll/hakyll build
          else
            # 'cabal run hakyll -- build' runs the site generator.
            # The generator (site.hs) changes directory to the project root and outputs to _site.
            cabal run hakyll -- build
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Use only the compiled Hakyll output directory as the Pages artifact.
          path: './_site'

  deploy:
    if: github.ref == 'refs/heads/gwern-style'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
